# =====================================================================
#  ThinDesk - Microsserviço de Chamados
#  NENHUMA credencial fica neste arquivo: tudo sensível vem de variáveis
#  de ambiente ou de um arquivo .env (que está no .gitignore).
# =====================================================================

# Lê o .env do serviço de login (pasta vizinha) e depois o .env deste projeto,
# se existirem. O último tem prioridade.
spring.config.import=optional:file:../secure-login/.env[.properties],optional:file:.env[.properties]

spring.application.name=chamados-service
server.port=${CHAMADOS_PORT:8081}

# ---------------------------------------------------------------------
#  MongoDB - o mesmo cluster do serviço de login.
#  Os chamados ficam na coleção "chamados".
# ---------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:securelogin}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------
#  Autenticação reutilizada: as MESMAS sessões do serviço de login.
#  Quem faz login no serviço de login (porta 8080) recebe o cookie SESSION,
#  que também é aceito por este microsserviço.
# ---------------------------------------------------------------------
spring.session.mongodb.collection-name=sessions
spring.session.timeout=30m
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Perfis do serviço de login que atuam como TÉCNICO (podem resolver chamados)
thindesk.perfis-tecnico=MANAGER,ADMIN

# ---------------------------------------------------------------------
#  Erros (não expor detalhes internos)
# ---------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.br.com.thindesk=INFO
